<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Save One Drop One — Streamer Native</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #0e0e12; }
  body { font-family: "Inter", system-ui, sans-serif; }
  #root { min-height: 100vh; }
  *, *::before, *::after { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="data.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="theme-streamer.jsx"></script>

<script type="text/babel" data-presets="react">
const { useState } = React;

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "screen": "result",
  "liveState": "regular"
}/*EDITMODE-END*/;

const SCREEN_OPTIONS = [
  { value: 'home',    label: 'Home' },
  { value: 'matchup', label: 'Matchup' },
  { value: 'result',  label: 'Result' },
];

function App() {
  const [tweaks, setTweak] = useTweaks(TWEAK_DEFAULTS);
  const onScreenChange = (s) => setTweak('screen', s);

  return (
    <div data-screen-label={`streamer — ${tweaks.screen}`}>
      <window.StreamerTheme screen={tweaks.screen} onScreenChange={onScreenChange} t={tweaks} />
      <TweaksPanel title="Tweaks">
        <TweakSection label="Screen">
          <TweakRadio
            value={tweaks.screen}
            onChange={(v) => setTweak('screen', v)}
            options={SCREEN_OPTIONS}
          />
        </TweakSection>
        {tweaks.screen === 'matchup' && (
          <TweakSection label="Live Mode">
            <TweakSelect
              value={tweaks.liveState || 'regular'}
              onChange={(v) => setTweak('liveState', v)}
              options={[
                { value: 'regular',      label: 'Regular — Go Live CTA' },
                { value: 'connecting',   label: 'Connecting' },
                { value: 'connected',    label: 'Connected · live tally' },
                { value: 'no_votes',     label: 'Connected · no votes' },
                { value: 'disconnected', label: 'Disconnected' },
              ]}
            />
          </TweakSection>
        )}
      </TweaksPanel>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>

</body>
</html>
