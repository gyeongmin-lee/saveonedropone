<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Create Bracket</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #0e0e12; font-family: 'Inter', system-ui, sans-serif; color: #e8e6f0; }
  * { box-sizing: border-box; }
  .v2-thumb-slot:hover .v2-swap-badge { opacity: 1; }
  .cb-title-row:hover .cb-pencil { opacity: 1; }

  /* Custom scrollbar for the left composer pane */
  .cb-scroll { scrollbar-width: thin; scrollbar-color: #2a2a36 transparent; }
  .cb-scroll::-webkit-scrollbar { width: 10px; height: 10px; }
  .cb-scroll::-webkit-scrollbar-track { background: transparent; }
  .cb-scroll::-webkit-scrollbar-thumb {
    background: #2a2a36;
    border-radius: 999px;
    border: 2px solid #0e0e12;
  }
  .cb-scroll::-webkit-scrollbar-thumb:hover { background: #3a3a48; }
  .cb-scroll::-webkit-scrollbar-corner { background: transparent; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" data-screen-label="00 Shared atoms" src="create-bracket/shared.jsx"></script>
<script type="text/babel" data-screen-label="01 Composer"     src="create-bracket/composer.jsx"></script>
<script type="text/babel" data-screen-label="02 Published"    src="create-bracket/published.jsx"></script>

<script type="text/babel" data-presets="env,react">
  function App() {
    const [view, setView] = React.useState('composer'); // 'composer' | 'published'
    const { Composer, Published } = window;
    return view === 'composer'
      ? <Composer  onPublish={() => setView('published')} />
      : <Published onEdit={()    => setView('composer')} />;
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
