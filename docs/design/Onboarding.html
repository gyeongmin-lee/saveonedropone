<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>First-Visit Onboarding — states</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; font-family: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<script type="text/babel" src="create-bracket/design-canvas.jsx"></script>
<script type="text/babel" src="onboarding/states.jsx"></script>

<script type="text/babel" data-presets="env,react">
  const { DesignCanvas, DCSection, DCArtboard, DCPostIt } = window;

  function App() {
    return (
      <DesignCanvas>
        <DCSection
          id="brief"
          title="First-Visit Onboarding Modal"
          subtitle="Anonymous visitors landing on Browse for the first time. Modal centered over the home feed, dimmed backdrop. Skip is always available; selection reshuffles the same feed underneath — no separate landing page, no account required."
        >
          <DCPostIt top={64} right={40} rotate={-2} width={300}>
            Single step: pick top-level categories. Personalized rail appears at the top of the feed; modal closes in place. If skipped, a small Personalize pill parks bottom-right so the offer doesn't disappear forever.
          </DCPostIt>
        </DCSection>

        <DCSection
          id="select"
          title="Category selection"
          subtitle="Modal first opens with nothing selected. Primary CTA disabled until at least one category is picked. Categories show a stripe placeholder + sentence-case label + tiny mono sub-label hinting what's inside."
        >
          <DCArtboard id="fresh" label="Fresh · nothing selected" width={1180} height={760}>
            <ONFresh />
          </DCArtboard>
          <DCArtboard id="selecting" label="Selecting · 3 categories chosen" width={1180} height={760}>
            <ONSelecting />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="apply"
          title="Immediate feed personalization"
          subtitle="On Save, the modal fades + drops 8px while the feed reshuffles in place: a 'For you · 3 interests' rail slides in at the top of Browse, a confirmation toast pops near the nav. No route change."
        >
          <DCArtboard id="reshuffle" label="Closing · feed reshuffles behind" width={1180} height={760}>
            <ONReshuffle />
          </DCArtboard>
        </DCSection>

        <DCSection
          id="skip"
          title="Skip / dismiss"
          subtitle="Skipping returns the user to the default Trending feed. A small 'Personalize home' pill parks bottom-right so they can re-open the modal whenever — never auto-resurface the modal itself."
        >
          <DCArtboard id="dismissed" label="Dismissed · re-open pill parked" width={1180} height={760}>
            <ONDismissed />
          </DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
