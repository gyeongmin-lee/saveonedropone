<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;color:#e8e6f0;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:140px;gap:32px;padding:0 32px}
.r{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{background:#18181f;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)}
.s{width:50px;height:50px;border-radius:4px}
.m{width:50px;height:50px;border-radius:6px}
.l{width:50px;height:50px;border-radius:10px}
.x{width:50px;height:50px;border-radius:12px}
.p{width:80px;height:36px;border-radius:999px}
.lbl{font-size:10px;color:#9b9aab;font-family:"JetBrains Mono",monospace}
</style></head><body>
<div class="r"><div class="box s"></div><div class="lbl">4 · sm</div></div>
<div class="r"><div class="box m"></div><div class="lbl">6 · md (btn)</div></div>
<div class="r"><div class="box l"></div><div class="lbl">10 · lg (card)</div></div>
<div class="r"><div class="box x"></div><div class="lbl">12 · xl</div></div>
<div class="r"><div class="box p"></div><div class="lbl">999 · pill</div></div>
</body></html>
