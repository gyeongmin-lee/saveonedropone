<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;color:#e8e6f0;font-family:Inter,sans-serif;display:flex;align-items:flex-end;justify-content:center;height:140px;gap:18px;padding:0 32px 16px}
.r{display:flex;flex-direction:column;align-items:center;gap:6px}
.box{background:#7c3aed;border-radius:4px}
.lbl{font-size:10px;color:#9b9aab;font-family:"JetBrains Mono",monospace}
</style></head><body>
<div class="r"><div class="box" style="width:4px;height:4px"></div><div class="lbl">1 · 4px</div></div>
<div class="r"><div class="box" style="width:8px;height:8px"></div><div class="lbl">2 · 8</div></div>
<div class="r"><div class="box" style="width:12px;height:12px"></div><div class="lbl">3 · 12</div></div>
<div class="r"><div class="box" style="width:16px;height:16px"></div><div class="lbl">4 · 16</div></div>
<div class="r"><div class="box" style="width:24px;height:24px"></div><div class="lbl">6 · 24</div></div>
<div class="r"><div class="box" style="width:32px;height:32px"></div><div class="lbl">8 · 32</div></div>
</body></html>
