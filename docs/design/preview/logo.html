<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;color:#e8e6f0;font-family:Inter,sans-serif;display:flex;align-items:center;height:80px;padding:0 24px;gap:32px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-0.02em}
.mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#7c3aed,#38e07b);display:inline-flex;align-items:center;justify-content:center;font-weight:800;color:#0e0e12;font-size:18px}
.alt .mark{background:#7c3aed;color:#fff}
.alt2 .mark{background:transparent;box-shadow:inset 0 0 0 2px #7c3aed;color:#7c3aed}
</style></head><body>
<div class="logo"><span class="mark">S</span>SaveDrop</div>
<div class="logo alt"><span class="mark">S</span>SaveDrop</div>
<div class="logo alt2"><span class="mark">S</span>SaveDrop</div>
</body></html>
