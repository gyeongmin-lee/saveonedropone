<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;color:#e8e6f0;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:140px;gap:24px;padding:0 32px}
.r{display:flex;align-items:center;gap:12px}
.sw{width:32px;height:32px;border-radius:6px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.t{display:flex;flex-direction:column}
.t b{font-size:13px}
.t span{font-size:11px;color:#9b9aab;font-family:"JetBrains Mono",monospace}
</style></head><body>
<div class="r"><div class="sw" style="background:#e8e6f0"></div><div class="t"><b>fg primary</b><span>#E8E6F0</span></div></div>
<div class="r"><div class="sw" style="background:#c4c2d2"></div><div class="t"><b style="color:#c4c2d2">fg secondary</b><span>#C4C2D2</span></div></div>
<div class="r"><div class="sw" style="background:#9b9aab"></div><div class="t"><b style="color:#9b9aab">fg muted</b><span>#9B9AAB</span></div></div>
<div class="r"><div class="sw" style="background:#6b6b7d"></div><div class="t"><b style="color:#6b6b7d">fg quiet</b><span>#6B6B7D</span></div></div>
</body></html>
