<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;color:#e8e6f0;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:140px;gap:20px;padding:0 32px}
.r{display:flex;flex-direction:column;align-items:center;gap:8px}
.sw{width:80px;height:60px;border-radius:8px}
.lbl{font-size:11px;font-family:"JetBrains Mono",monospace}
.cap{font-size:10px;color:#9b9aab}
</style></head><body>
<div class="r"><div class="sw" style="background:#7c3aed"></div><div class="lbl">#7C3AED</div><div class="cap">accent purple</div></div>
<div class="r"><div class="sw" style="background:#b794f4"></div><div class="lbl">#B794F4</div><div class="cap">purple light</div></div>
<div class="r"><div class="sw" style="background:#38e07b"></div><div class="lbl">#38E07B</div><div class="cap">accent green</div></div>
<div class="r"><div class="sw" style="background:linear-gradient(135deg,#7c3aed,#38e07b)"></div><div class="lbl">brand</div><div class="cap">purple → green</div></div>
</body></html>
