<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:140px;gap:14px;flex-wrap:wrap;padding:0 32px}
button{font-family:inherit;cursor:pointer;font-weight:600;border:0}
.p{background:#7c3aed;color:#fff;padding:10px 22px;border-radius:6px;font-size:14px}
.s{background:#1f1f28;color:#e8e6f0;padding:10px 18px;border-radius:6px;font-size:14px}
.t{background:transparent;color:#e8e6f0;padding:9px 16px;border-radius:6px;font-size:14px;border:1px solid #1f1f28}
.i{background:transparent;color:#e8e6f0;width:36px;height:36px;border-radius:6px;font-size:16px;display:inline-flex;align-items:center;justify-content:center}
.lg{background:#7c3aed;color:#fff;padding:14px 28px;border-radius:8px;font-size:16px;font-weight:700}
</style></head><body>
<button class="lg">Save Jiwoo →</button>
<button class="p">▶ Start tournament</button>
<button class="s">📺 OBS source</button>
<button class="t">Skip</button>
<button class="i">↻</button>
</body></html>
