<!DOCTYPE html>
<html><head><meta charset="utf-8"><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;color:#e8e6f0;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:140px;gap:24px;padding:0 32px}
.s{width:88px;height:88px;border-radius:10px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;box-sizing:border-box;font-size:10px;font-weight:600}
.s b{display:block;font-size:11px;font-family:"JetBrains Mono",monospace;letter-spacing:.05em}
.s span{opacity:.7;font-size:10px}
</style></head><body>
<div class="s" style="background:#0e0e12;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)"><b>#0E0E12</b><span>bg-base</span></div>
<div class="s" style="background:#0a0a0e;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06)"><b>#0A0A0E</b><span>bg-nav</span></div>
<div class="s" style="background:#18181f"><b>#18181F</b><span>bg-card</span></div>
<div class="s" style="background:#1f1f28"><b>#1F1F28</b><span>bg-hover</span></div>
</body></html>
