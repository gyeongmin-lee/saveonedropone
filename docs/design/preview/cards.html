<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:170px;gap:16px;padding:0 24px}
.card{width:200px;background:#18181f;border-radius:10px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);overflow:hidden}
.thumb{height:80px;background:repeating-linear-gradient(135deg,#7c3aed 0 6px,#5b21b6 6px 12px)}
.body{padding:10px 12px}
.t{font-weight:700;font-size:13px;color:#e8e6f0;margin-bottom:4px}
.m{font-size:11px;color:#9b9aab;font-family:"JetBrains Mono",monospace}
.c2 .thumb{background:repeating-linear-gradient(135deg,#38e07b 0 6px,#0a5d2e 6px 12px)}
</style></head><body>
<div class="card"><div class="thumb"></div><div class="body"><div class="t">K-Pop Girl Groups 2026</div><div class="m">128 · 482K plays</div></div></div>
<div class="card c2"><div class="thumb"></div><div class="body"><div class="t">NBA All-Time Centers</div><div class="m">64 · 121K plays</div></div></div>
</body></html>
