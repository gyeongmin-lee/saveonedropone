<!DOCTYPE html>
<html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=JetBrains+Mono:wght@600&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#0e0e12;font-family:Inter,sans-serif;display:flex;align-items:center;justify-content:center;height:140px;gap:10px;flex-wrap:wrap;padding:0 24px}
.pill{padding:6px 12px;border-radius:999px;font-size:12px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.live{background:rgba(56,224,123,.2);color:#38e07b;font-family:"JetBrains Mono",monospace}
.dot{width:6px;height:6px;border-radius:999px;background:#38e07b;box-shadow:0 0 6px #38e07b}
.tag{background:#1f1f28;color:#c4c2d2}
.acc{background:rgba(124,58,237,.2);color:#b794f4}
.seed{background:#0a0a0e;color:#9b9aab;font-family:"JetBrains Mono",monospace;width:28px;height:28px;border-radius:999px;display:inline-flex;align-items:center;justify-content:center;padding:0;font-size:11px}
.win{background:#38e07b;color:#0e0e12}
</style></head><body>
<span class="pill live"><span class="dot"></span>LIVE · 1,240</span>
<span class="pill tag">K-Pop</span>
<span class="pill acc">62.4%</span>
<span class="pill seed">#1</span>
<span class="pill win">WINNER</span>
</body></html>
